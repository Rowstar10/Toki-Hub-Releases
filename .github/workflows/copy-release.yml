name: Copy a release

# Temporary, removed once Toki Hub's releases are published here directly (release.py in the
# source repo): copies a release of Toki Hub, its Toki Hub.exe, Toki-Hub-android.apk and notes,
# from the source repo while it is still public.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The release to copy, like tauri-v0.3.18"
        required: true

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      FROM: Rowstar10/Toki-Hub
    steps:
      - name: Copy it
        run: |
          mkdir -p files
          gh release download "$TAG" --repo "$FROM" --dir files
          gh release view "$TAG" --repo "$FROM" --json body --jq .body > notes.md
          title="$(gh release view "$TAG" --repo "$FROM" --json name --jq .name)"
          ls -la files
          assets=()
          for file in files/*; do
            case "$file" in
              *.exe) assets+=("$file#Toki Hub.exe") ;;
              *) assets+=("$file") ;;
            esac
          done
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file notes.md --latest
          fi
